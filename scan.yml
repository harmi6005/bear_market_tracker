# 이 파일은 반드시 저장소 안의 정확히 이 경로에 있어야 합니다:
#   .github/workflows/scan.yml
#
# GitHub 저장소를 만든 뒤, 저장소 루트에 ".github/workflows" 폴더를 만들고
# 그 안에 이 파일을 "scan.yml" 이라는 이름으로 넣으세요.

name: 하락장 종목 자동 스캔

on:
  schedule:
    # cron은 UTC 기준입니다. 한국시간(KST)은 UTC+9.
    # 매일 한국시간 15:40(장 마감 후) 실행 -> UTC 06:40
    - cron: "40 6 * * 1-5"   # 월~금만 실행 (0=일요일, 6=토요일 제외)
  workflow_dispatch: {}       # GitHub 웹사이트에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 스캔 실행 및 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bear_market_tracker.py --now
